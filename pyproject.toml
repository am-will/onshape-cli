[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onshape-cli"
version = "0.1.0"
description = "Command-line Onshape CAD automation: sketches, extrudes, fillets, chamfers, shells, booleans, patterns, edge queries, mass properties, and STL/STEP export."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "William Ryan" }]
requires-python = ">=3.10"
keywords = ["onshape", "cad", "cli", "3d-printing", "featurescript", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
keychain = ["keyring>=24"]

[project.urls]
Homepage = "https://github.com/am-will/onshape-cli"
Repository = "https://github.com/am-will/onshape-cli"

[project.scripts]
onshape-cli = "onshape_cli.cli:main"

[tool.setuptools.packages.find]
include = ["onshape_cli*"]
